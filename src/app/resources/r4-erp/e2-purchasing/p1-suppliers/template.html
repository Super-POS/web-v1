<pos-list-page extraClass="erp-list-page min-h-0 flex-1" [toolbarBorder]="true" bodyClass="erp-list-body w-full flex-1 min-h-0 p-4 md:px-6" [inset]="false">
    <pos-breadcrumb posBreadcrumb [segments]="['ERP', 'Purchasing', 'Suppliers']" />
    <ng-container posActions>
        <button class="helpers-mat-button-sm w-6" type="button" (click)="openCreateDialog()" mat-stroked-button>
                <mat-icon class="icon-size-6 text-slate-500" svgIcon="heroicons_outline:plus"></mat-icon>
            </button>
    </ng-container>

<ng-container *ngIf="isLoading">
            <div class="px-4 py-6 text-slate-500">Getting data from API...</div>
        </ng-container>

        <div *ngIf="rows.length === 0 && !isLoading" class="no-data w-full bg-white border border-slate-100 dark:border-gray-700 rounded-lg dark:bg-gray-800">
            <div class="flex flex-col justify-center items-center mb-4 py-12">
                <mat-icon class="icon-size-24" svgIcon="toc"></mat-icon>
                <span class="text-2xl -mt-3">No data</span>
                <span class="text-sm text-slate-500 mt-2 px-6 text-center">Use the + button to add a supplier.</span>
            </div>
        </div>

        <div *ngIf="rows.length > 0 && !isLoading" class="list-sale-content erp-list-table w-full min-w-0 rounded-lg border border-slate-100 dark:border-gray-700 flex flex-col bg-white dark:bg-gray-800">
            <div class="list-sale-data erp-list-table__scroll min-w-0 w-full overflow-x-auto">
                <table mat-table [dataSource]="rows" class="w-full min-w-0 erp-table">
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>
                        <td mat-cell *matCellDef="let r">
                            <span class="font-semibold">{{ r.name }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="contact_person">
                        <th mat-header-cell *matHeaderCellDef>Contact Person</th>
                        <td mat-cell *matCellDef="let r">{{ r.contact_person || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="phone">
                        <th mat-header-cell *matHeaderCellDef>Phone</th>
                        <td mat-cell *matCellDef="let r">{{ r.phone || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let r">{{ r.email || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="payment_terms">
                        <th mat-header-cell *matHeaderCellDef>Payment Terms</th>
                        <td mat-cell *matCellDef="let r">{{ r.payment_terms || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="is_active">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let r">
                            <span *ngIf="r.is_active"
                                class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200">
                                Active
                            </span>
                            <span *ngIf="!r.is_active"
                                class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">
                                Inactive
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions" stickyEnd>
                        <th mat-header-cell *matHeaderCellDef>Action</th>
                        <td mat-cell *matCellDef="let r">
                            <button mat-icon-button type="button" [matMenuTriggerFor]="rowMenu" aria-label="Open row actions">
                                <mat-icon class="icon-size-6" svgIcon="mat_outline:more_vert"></mat-icon>
                            </button>
                            <mat-menu #rowMenu="matMenu">
                                <button mat-menu-item type="button" (click)="openUpdateDialog(r)">
                                    <mat-icon class="icon-size-6" svgIcon="mdi:square-edit-outline"></mat-icon>
                                    <span class="text-lg">Edit</span>
                                </button>
                                <button mat-menu-item type="button" (click)="toggleActive(r)">
                                    <mat-icon class="icon-size-6" [svgIcon]="r.is_active ? 'mdi:toggle-switch-off-outline' : 'mdi:toggle-switch'"></mat-icon>
                                    <span class="text-lg">{{ r.is_active ? 'Deactivate' : 'Activate' }}</span>
                                </button>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </div>
        </div>
</pos-list-page>
