<div class="out-create-section md-form-field-appearance-outline">
    <div mat-dialog-title class="min-h-14 max-h-14 flex gap-2 justify-between items-center py-2 pr-2.5">
        <div class="flex flex-1 items-center text-slate-500">
            <h1 class="text-3xl">Add Supplier</h1>
        </div>
        <div class="flex items-center cursor-pointer">
            <mat-icon class="-mb-0.5" [svgIcon]="'heroicons_outline:x-mark'" (click)="closeDialog()"></mat-icon>
        </div>
    </div>

    <div class="out-create-body px-4 pb-2">
        <form [formGroup]="form" class="out-create-content border-t pt-4 space-y-1">

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Supplier Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. ABC Trading Co." />
                <mat-error>Name is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Contact Person</mat-label>
                <input matInput formControlName="contact_person" placeholder="e.g. John Smith" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Phone</mat-label>
                <input matInput formControlName="phone" placeholder="e.g. +855 12 345 678" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="email" placeholder="e.g. supplier@example.com" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Address</mat-label>
                <textarea matInput formControlName="address" rows="2" placeholder="Full address"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Payment Terms</mat-label>
                <input matInput formControlName="payment_terms" placeholder="e.g. Net 30" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Notes</mat-label>
                <textarea matInput formControlName="notes" rows="2" placeholder="Internal notes"></textarea>
            </mat-form-field>

        </form>
    </div>

    <mat-dialog-actions>
        <div class="w-full flex justify-end px-1">
            <button class="helpers-mat-button-md text-white pos-btn-primary" mat-flat-button type="button"
                (click)="submit()" [disabled]="isSaving || !form.valid">
                <span *ngIf="!isSaving">Create</span>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
            </button>
        </div>
    </mat-dialog-actions>
</div>
