<div class="out-create-section md-form-field-appearance-outline">
    <div mat-dialog-title class="min-h-14 max-h-14 flex gap-2 justify-between items-center py-2 pr-2.5">
        <div class="flex flex-1 items-center text-slate-500">
            <h1 class="text-3xl">Mark Attendance</h1>
        </div>
        <div class="flex items-center cursor-pointer">
            <mat-icon class="-mb-0.5" [svgIcon]="'heroicons_outline:x-mark'" (click)="closeDialog()"></mat-icon>
        </div>
    </div>

    <div class="out-create-body px-4 pb-2">
        <form [formGroup]="form" class="out-create-content border-t pt-4 space-y-1">

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Employee ID</mat-label>
                <input matInput type="number" formControlName="employee_id" placeholder="Employee ID" />
                <mat-error>Employee ID is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Date</mat-label>
                <input matInput type="date" formControlName="date" />
                <mat-error>Date is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Status</mat-label>
                <mat-select formControlName="status">
                    <mat-option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</mat-option>
                </mat-select>
                <mat-error>Status is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Clock In (optional)</mat-label>
                <input matInput type="time" formControlName="clock_in" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Clock Out (optional)</mat-label>
                <input matInput type="time" formControlName="clock_out" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Overtime Hours (optional)</mat-label>
                <input matInput type="number" formControlName="overtime_hours" min="0" step="0.5" placeholder="0" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Notes (optional)</mat-label>
                <textarea matInput formControlName="notes" rows="3" placeholder="Any remarks..."></textarea>
            </mat-form-field>

        </form>
    </div>

    <mat-dialog-actions>
        <div class="w-full flex justify-end px-1">
            <button class="helpers-mat-button-md text-white pos-btn-primary" mat-flat-button type="button"
                (click)="submit()" [disabled]="isSaving">
                <span *ngIf="!isSaving">Save</span>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
            </button>
        </div>
    </mat-dialog-actions>
</div>
