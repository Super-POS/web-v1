<div class="out-create-section md-form-field-appearance-outline">
    <div mat-dialog-title class="min-h-14 max-h-14 flex gap-2 justify-between items-center py-2 pr-2.5">
        <div class="flex flex-1 items-center text-slate-500">
            <h1 class="text-3xl">Generate Payroll</h1>
        </div>
        <div class="flex items-center cursor-pointer">
            <mat-icon class="-mb-0.5" [svgIcon]="'heroicons_outline:x-mark'" (click)="closeDialog()"></mat-icon>
        </div>
    </div>

    <div class="out-create-body px-4 pb-2">
        <!-- Info box -->
        <div class="mb-4 mt-2 p-3 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800">
            <div class="flex items-start gap-2">
                <mat-icon class="icon-size-5 text-blue-500 mt-0.5 flex-shrink-0" svgIcon="heroicons_outline:information-circle"></mat-icon>
                <p class="text-sm text-blue-700 dark:text-blue-300">
                    Payroll is calculated as:
                    <strong>Net = Base Salary + (Overtime Hours × Hourly Rate) − Leave Deductions</strong>.
                    All active employees in the system will be included.
                </p>
            </div>
        </div>

        <form [formGroup]="form" class="out-create-content border-t pt-4 space-y-1">

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Period Start</mat-label>
                <input matInput type="date" formControlName="period_start" />
                <mat-error>Period start date is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Period End</mat-label>
                <input matInput type="date" formControlName="period_end" />
                <mat-error>Period end date is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Notes (optional)</mat-label>
                <textarea matInput formControlName="notes" rows="3" placeholder="e.g. January 2026 payroll"></textarea>
            </mat-form-field>

        </form>
    </div>

    <mat-dialog-actions>
        <div class="w-full flex justify-end px-1">
            <button class="helpers-mat-button-md text-white pos-btn-primary" mat-flat-button type="button"
                (click)="submit()" [disabled]="isSaving">
                <span *ngIf="!isSaving">Generate</span>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
            </button>
        </div>
    </mat-dialog-actions>
</div>
