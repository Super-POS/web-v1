<div class="out-create-section md-form-field-appearance-outline">
    <div mat-dialog-title class="min-h-14 max-h-14 flex gap-2 justify-between items-center py-2 pr-2.5">
        <div class="flex flex-1 items-center text-slate-500">
            <h1 class="text-3xl">Edit Expense Category</h1>
        </div>
        <div class="flex items-center cursor-pointer">
            <mat-icon class="-mb-0.5" [svgIcon]="'heroicons_outline:x-mark'" (click)="closeDialog()"></mat-icon>
        </div>
    </div>

    <div class="out-create-body px-4 pb-2">
        <form [formGroup]="form" class="out-create-content border-t pt-4 space-y-1">

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Category Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. Rent, Utilities, Marketing" />
                <mat-error>Name is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Type</mat-label>
                <mat-select formControlName="type">
                    <mat-option value="fixed">Fixed</mat-option>
                    <mat-option value="variable">Variable</mat-option>
                </mat-select>
                <mat-error>Type is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Description (optional)</mat-label>
                <textarea matInput formControlName="description" rows="3" placeholder="Describe this category"></textarea>
            </mat-form-field>

        </form>
    </div>

    <mat-dialog-actions>
        <div class="w-full flex justify-end px-1">
            <button class="helpers-mat-button-md text-white bg-[#102d71]" mat-flat-button type="button"
                (click)="submit()" [disabled]="isSaving || !form.valid">
                <span *ngIf="!isSaving">Save Changes</span>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
            </button>
        </div>
    </mat-dialog-actions>
</div>
