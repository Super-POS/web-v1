<div class="out-create-section md-form-field-appearance-outline">
    <div mat-dialog-title class="min-h-14 max-h-14 flex gap-2 justify-between items-center py-2 pr-2.5">
        <div class="flex flex-1 items-center text-slate-500">
            <h1 class="text-3xl">Add Expense</h1>
        </div>
        <div class="flex items-center cursor-pointer">
            <mat-icon class="-mb-0.5" [svgIcon]="'heroicons_outline:x-mark'" (click)="closeDialog()"></mat-icon>
        </div>
    </div>

    <div class="out-create-body px-4 pb-2">
        <form [formGroup]="form" class="out-create-content border-t pt-4 space-y-1">

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Category</mat-label>
                <mat-select formControlName="category_id">
                    <mat-option *ngIf="isLoadingCategories" disabled>
                        Loading categories...
                    </mat-option>
                    <mat-option *ngFor="let cat of categories" [value]="cat.id">
                        {{ cat.name }}
                        <span class="text-xs text-slate-400 ml-1">({{ cat.type }})</span>
                    </mat-option>
                </mat-select>
                <mat-error>Category is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Date</mat-label>
                <input matInput type="date" formControlName="date" />
                <mat-error>Date is required</mat-error>
            </mat-form-field>

            <div class="flex gap-2">
                <mat-form-field appearance="outline" class="flex-1">
                    <mat-label>Amount</mat-label>
                    <input matInput type="number" formControlName="amount" min="0.01" step="0.01" placeholder="0.00" />
                    <mat-error>Amount is required</mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline" class="w-24">
                    <mat-label>Currency</mat-label>
                    <input matInput formControlName="currency" placeholder="USD" maxlength="10" />
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Description (optional)</mat-label>
                <textarea matInput formControlName="description" rows="2" placeholder="Brief description"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Reference (optional)</mat-label>
                <input matInput formControlName="reference" placeholder="e.g. Invoice #123" />
            </mat-form-field>

        </form>
    </div>

    <mat-dialog-actions>
        <div class="w-full flex justify-end px-1">
            <button class="helpers-mat-button-md text-white pos-btn-primary" mat-flat-button type="button"
                (click)="submit()" [disabled]="isSaving || !form.valid">
                <span *ngIf="!isSaving">Add Expense</span>
                <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
            </button>
        </div>
    </mat-dialog-actions>
</div>
