<div class="list-sale-section flex-1 min-w-0 bg-white dark:bg-gray-800 mt-4 mx-4 rounded-tl-lg rounded-tr-lg">
    <div class="bg-white min-h-14 flex gap-2 justify-between items-center py-2 pl-5 pr-2.5 dark:bg-gray-800 flex-wrap">
        <div class="flex flex-1 items-center font-medium">
            <div class="flex items-center">
                <mat-icon class="text-gray-600 dark:text-white icon-size-5" [svgIcon]="'heroicons_outline:home'"></mat-icon>
            </div>
            <div class="flex items-center ml-1.5">
                <span class="text-lg text-gray-600 dark:text-white -mb-0.5">ERP</span>
            </div>
            <div class="flex items-center">
                <mat-icon class="-mb-0.5" [svgIcon]="'mat_solid:chevron_right'"></mat-icon>
                <span class="text-lg text-gray-600 dark:text-white -mb-0.5">P&amp;L</span>
            </div>
            <div class="flex items-center">
                <mat-icon class="-mb-0.5" [svgIcon]="'mat_solid:chevron_right'"></mat-icon>
                <span class="text-lg text-gray-600 dark:text-white -mb-0.5">Expenses</span>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <form [formGroup]="filterForm" class="flex items-center gap-2">
                <mat-form-field appearance="outline" class="helpers-mat-form-field-sm w-36">
                    <mat-label>From</mat-label>
                    <input matInput type="date" formControlName="start_date" />
                </mat-form-field>
                <mat-form-field appearance="outline" class="helpers-mat-form-field-sm w-36">
                    <mat-label>To</mat-label>
                    <input matInput type="date" formControlName="end_date" />
                </mat-form-field>
                <button class="helpers-mat-button-sm" type="button" (click)="search()" mat-stroked-button>
                    <mat-icon class="icon-size-5 text-slate-500" svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
                </button>
            </form>
            <button class="helpers-mat-button-sm w-6" type="button" (click)="openCreateDialog()" mat-stroked-button>
                <mat-icon class="icon-size-6 text-slate-500" svgIcon="heroicons_outline:plus"></mat-icon>
            </button>
        </div>
    </div>

    <div class="list-sale-body">
        <ng-container *ngIf="isLoading">
            <div class="px-4 py-6 text-slate-500">Getting data from API...</div>
        </ng-container>

        <div *ngIf="rows.length === 0 && !isLoading" class="no-data bg-white border-t dark:bg-gray-800">
            <div class="flex flex-col justify-center items-center mb-4 py-12">
                <mat-icon class="icon-size-24" svgIcon="toc"></mat-icon>
                <span class="text-2xl -mt-3">No data</span>
                <span class="text-sm text-slate-500 mt-2 px-6 text-center">Use the + button to record an expense.</span>
            </div>
        </div>

        <div *ngIf="rows.length > 0 && !isLoading" class="list-sale-content px-4 pb-4 bg-white rounded-bl-xl rounded-br-xl dark:bg-gray-800">
            <div class="list-sale-data overflow-x-auto">
                <table mat-table [dataSource]="rows" class="w-full min-w-[520px]">
                    <ng-container matColumnDef="date">
                        <th mat-header-cell *matHeaderCellDef>Date</th>
                        <td mat-cell *matCellDef="let r">{{ r.date | date:'dd MMM yyyy' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="category">
                        <th mat-header-cell *matHeaderCellDef>Category</th>
                        <td mat-cell *matCellDef="let r">{{ r.category?.name || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef>Description</th>
                        <td mat-cell *matCellDef="let r" class="text-slate-600 dark:text-slate-400">{{ r.description || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="amount">
                        <th mat-header-cell *matHeaderCellDef>Amount</th>
                        <td mat-cell *matCellDef="let r">
                            <span class="font-semibold">$ {{ r.amount | number:'1.2-2' }}</span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="reference">
                        <th mat-header-cell *matHeaderCellDef>Reference</th>
                        <td mat-cell *matCellDef="let r" class="text-slate-500 text-sm">{{ r.reference || '—' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions" stickyEnd>
                        <th mat-header-cell *matHeaderCellDef>Action</th>
                        <td mat-cell *matCellDef="let r">
                            <button mat-icon-button type="button" [matMenuTriggerFor]="rowMenu" aria-label="Open row actions">
                                <mat-icon class="icon-size-6" svgIcon="mat_outline:more_vert"></mat-icon>
                            </button>
                            <mat-menu #rowMenu="matMenu">
                                <button mat-menu-item type="button" (click)="remove(r)">
                                    <mat-icon class="icon-size-6 text-red-400" svgIcon="mdi:trash-can-outline"></mat-icon>
                                    <span class="text-lg text-red-400">Delete</span>
                                </button>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
            </div>
        </div>
    </div>
</div>
