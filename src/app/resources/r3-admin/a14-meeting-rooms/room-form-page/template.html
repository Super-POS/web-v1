<div class="room-form-page pos-form-shell">
    <header class="room-form-page__header">
        <pos-breadcrumb [segments]="breadcrumbSegments" />
        <h1 class="room-form-page__title">{{ pageTitle }}</h1>
    </header>

    <div *ngIf="isLoading" class="room-form-page__loading">
        <mat-spinner diameter="32"></mat-spinner>
        <span>Loading room…</span>
    </div>

    <div class="room-form-page__content" *ngIf="formReady && !isLoading">
        <form [formGroup]="form" class="room-form-page__panel">
            <div class="room-form-page__sections">
                <section class="section">
                    <h2 class="section__title">Room details</h2>

                    <mat-form-field appearance="outline" class="field w-full">
                        <mat-label>Room name</mat-label>
                        <input matInput formControlName="name" maxlength="100" placeholder="e.g. Summit Hall" />
                        <mat-error>Name is required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="field w-full">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="3" placeholder="Short description for customers"></textarea>
                    </mat-form-field>

                    <div class="fields-grid fields-grid--pair">
                        <mat-form-field appearance="outline" class="field w-full">
                            <mat-label>Capacity (guests)</mat-label>
                            <input matInput type="number" formControlName="capacity" min="1" step="1" />
                            <mat-error>Minimum 1 guest</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="field w-full">
                            <mat-label>Price per hour (USD)</mat-label>
                            <input matInput type="number" formControlName="price_per_hour" min="0" step="0.01" placeholder="Optional" />
                        </mat-form-field>
                    </div>
                </section>

                <section class="section">
                    <h2 class="section__title">Type &amp; status</h2>

                    <div class="fields-grid fields-grid--pair">
                        <mat-form-field appearance="outline" class="field w-full">
                            <mat-label>Room type</mat-label>
                            <mat-select formControlName="type">
                                <mat-option *ngFor="let t of roomTypes" [value]="t.value">{{ t.label }}</mat-option>
                            </mat-select>
                        </mat-form-field>

                        <mat-form-field appearance="outline" class="field w-full">
                            <mat-label>Status</mat-label>
                            <mat-select formControlName="status">
                                <mat-option *ngFor="let s of roomStatuses" [value]="s.value">{{ s.label }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <mat-form-field appearance="outline" class="field w-full">
                        <mat-label>Internal notes</mat-label>
                        <textarea matInput formControlName="notes" rows="2" placeholder="Staff-only notes"></textarea>
                    </mat-form-field>
                </section>
            </div>

            <div class="actions">
                <button class="helpers-mat-button-md" mat-stroked-button type="button" (click)="goBack()" [disabled]="isSaving">
                    Cancel
                </button>
                <button
                    class="helpers-mat-button-md pos-btn-primary"
                    mat-flat-button
                    type="button"
                    (click)="save()"
                    [disabled]="form.invalid || isSaving">
                    <span *ngIf="!isSaving">{{ actionLabel }}</span>
                    <mat-progress-spinner *ngIf="isSaving" [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
                </button>
            </div>
        </form>
    </div>
</div>
