<pos-list-page extraClass="meeting-list-page min-h-0 flex-1" [toolbarBorder]="true" bodyClass="meeting-list-body w-full flex-1 min-h-0 p-4 md:px-6" [inset]="false">
    <pos-breadcrumb posBreadcrumb [segments]="['Admin', 'Meeting rooms']" />
    <ng-container posActions>
        <button class="helpers-mat-button-sm w-6" type="button" (click)="openCreatePage()" mat-stroked-button>
            <mat-icon class="icon-size-6 text-slate-500" svgIcon="heroicons_outline:plus"></mat-icon>
        </button>
    </ng-container>

    <ng-container *ngIf="isLoading">
        <div class="py-6 text-slate-500">Loading rooms…</div>
    </ng-container>

    <div *ngIf="dataSource.data.length === 0 && !isLoading"
        class="no-data w-full bg-white border border-slate-100 dark:border-gray-700 rounded-lg dark:bg-gray-800">
        <div class="flex flex-col justify-center items-center py-12">
            <mat-icon class="icon-size-24" svgIcon="mdi:door-open"></mat-icon>
            <span class="text-2xl -mt-3">No meeting rooms</span>
            <span class="text-sm text-slate-500 mt-2 px-6 text-center">Use the + button to add a room.</span>
        </div>
    </div>

    <div *ngIf="dataSource.data.length > 0 && !isLoading"
        class="list-sale-content meeting-list-table w-full min-w-0 rounded-lg border border-slate-100 dark:border-gray-700 flex flex-col bg-white dark:bg-gray-800">
        <div class="list-sale-data meeting-list-table__scroll min-w-0 w-full">
            <table mat-table [dataSource]="dataSource" class="w-full min-w-0 meeting-rooms-table">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let r">
                        <span class="font-semibold text-slate-800 dark:text-slate-100">{{ r.name }}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="type">
                    <th mat-header-cell *matHeaderCellDef>Type</th>
                    <td mat-cell *matCellDef="let r">{{ typeLabel(r.type) }}</td>
                </ng-container>

                <ng-container matColumnDef="capacity">
                    <th mat-header-cell *matHeaderCellDef>Capacity</th>
                    <td mat-cell *matCellDef="let r" class="tabular-nums">{{ r.capacity }}</td>
                </ng-container>

                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Price / hr</th>
                    <td mat-cell *matCellDef="let r" class="text-right tabular-nums">
                        <ng-container *ngIf="r.price_per_hour != null; else noPrice">
                            ${{ r.price_per_hour | number:'1.2-2' }}
                        </ng-container>
                        <ng-template #noPrice>—</ng-template>
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let r">
                        <span
                            class="text-sm font-semibold"
                            [class.text-emerald-600]="(r.status || '').toLowerCase() === 'available'"
                            [class.text-amber-600]="(r.status || '').toLowerCase() === 'maintenance'"
                            [class.text-slate-500]="(r.status || '').toLowerCase() === 'inactive'">
                            {{ statusLabel(r.status) }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let r" class="max-w-xs text-sm text-slate-600 dark:text-slate-400">
                        <span class="line-clamp-2">{{ r.description || '—' }}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions" stickyEnd>
                    <th mat-header-cell *matHeaderCellDef>Action</th>
                    <td mat-cell *matCellDef="let r">
                        <button mat-icon-button type="button" [matMenuTriggerFor]="roomRowMenu" aria-label="Open row actions">
                            <mat-icon class="icon-size-6" svgIcon="mat_outline:more_vert"></mat-icon>
                        </button>
                        <mat-menu #roomRowMenu="matMenu">
                            <button mat-menu-item type="button" (click)="openEditPage(r)">
                                <mat-icon class="icon-size-6" svgIcon="mdi:square-edit-outline"></mat-icon>
                                <span class="text-lg">Edit</span>
                            </button>
                            <button mat-menu-item type="button" (click)="remove(r)">
                                <mat-icon class="icon-size-6 text-red-400" svgIcon="mdi:trash-can-outline"></mat-icon>
                                <span class="text-lg text-red-400">Delete</span>
                            </button>
                        </mat-menu>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
    </div>

    <div class="list-meeting-paginator dark:bg-gray-800" *ngIf="!isLoading && dataSource.data.length > 0">
        <mat-paginator
            class="w-full bg-white flex items-end justify-end overflow-hidden dark:bg-gray-800"
            [pageSizeOptions]="pageSizeOptions"
            [pageSize]="defaultPageSize"
            [showFirstLastButtons]="true">
        </mat-paginator>
    </div>
</pos-list-page>
