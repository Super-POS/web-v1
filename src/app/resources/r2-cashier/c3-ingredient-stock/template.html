<pos-list-page extraClass="w-full">
    <pos-breadcrumb posBreadcrumb [segments]="['Cashier', 'Ingredient stock']" />
    
<div *ngIf="isLoading">Getting data from API...</div>

        <div *ngIf="!isLoading && dataSource.data.length === 0" class="text-center py-8 text-gray-500">
            No data
        </div>

        <div *ngIf="!isLoading && dataSource.data.length > 0" class="w-full overflow-x-auto">
            <table mat-table [dataSource]="dataSource" class="w-full min-w-full">
                <ng-container matColumnDef="no">
                    <th mat-header-cell *matHeaderCellDef>No.</th>
                    <td mat-cell *matCellDef="let item; let i = index">{{ i + 1 }}</td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Ingredients</th>
                    <td mat-cell *matCellDef="let item">{{ item.name }}</td>
                </ng-container>

                <ng-container matColumnDef="unit">
                    <th mat-header-cell *matHeaderCellDef>Unit</th>
                    <td mat-cell *matCellDef="let item">{{ item.unit || '-' }}</td>
                </ng-container>

                <ng-container matColumnDef="quantity">
                    <th mat-header-cell *matHeaderCellDef>Stock quantity</th>
                    <td mat-cell *matCellDef="let item">{{ item.quantity | number:'1.0-3' }}</td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let item">
                        <span
                            class="text-sm font-semibold"
                            [class.text-emerald-700]="stockStatus(item.quantity, item.low_stock_threshold) === 'ok'"
                            [class.text-amber-700]="stockStatus(item.quantity, item.low_stock_threshold) === 'low'"
                            [class.text-red-700]="stockStatus(item.quantity, item.low_stock_threshold) === 'out'">
                            {{ stockStatusLabel(item.quantity, item.low_stock_threshold) }}
                        </span>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
        </div>
</pos-list-page>
