<h2 mat-dialog-title class="text-lg font-semibold">{{ data.name }} — Select Size</h2>

<mat-dialog-content>
    <div class="flex flex-col gap-3 py-2">
        <button *ngFor="let s of sizes"
            mat-stroked-button
            (click)="pick(s)"
            class="w-full flex justify-between items-center px-4 py-6 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition">
            <span class="text-base font-medium text-slate-700">{{ sizeLabels[s.size] }} ({{ s.size }})</span>
            <span class="text-base font-semibold text-emerald-600">
                ${{ s.price | usdFromKhr:data._khrPerUsd | number:'1.2-2' }}
            </span>
        </button>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
